name: CI — Build Check

# يمنع دمج/رفع أي كود يكسر البناء إلى production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

      # فحص انحراف سجل القدرات: قاعدة البيانات مقابل الـManifest (النوع/الوجود).
      # يفشل عند انحراف حقيقي، ويتسامح مع أعطال الشبكة (لا يكسر البناء).
      # يستخدم المفتاح anon العلني (fallback في السكربت)؛ للتحكّم، مرّر متغيّري
      # البيئة أدناه من إعدادات المستودع إن رغبت.
      - name: Registry drift check
        run: npm run check:registry
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
